<div class="wrap footer-sponsor">
  <div class="footer-sponsor-copy">
    <p class="footer-sponsor-eyebrow">Support the project</p>
    <p class="footer-sponsor-title">
      Sponsor <strong>${{ site.sponsor_pro_min_usd }}+</strong> →
      <strong>{{ site.sponsor_pro_hours }}-hour OdooSync Pro</strong> evaluation
    </p>
    <p class="footer-sponsor-note">
      Email <a href="mailto:{{ site.support_email }}">{{ site.support_email }}</a> after sponsoring to claim access.
    </p>
  </div>
  <div class="footer-sponsor-actions">
    <a class="sponsor-card sponsor-coffee sponsor-card-sm" href="{{ site.funding.buymeacoffee }}" target="_blank" rel="noopener noreferrer">
      <span class="sponsor-icon" aria-hidden="true">☕</span>
      <span>Coffee</span>
    </a>
    <a class="sponsor-card sponsor-github sponsor-card-sm" href="{{ site.funding.github_sponsors }}" target="_blank" rel="noopener noreferrer">
      <span class="sponsor-icon" aria-hidden="true">❤️</span>
      <span>Sponsor</span>
    </a>
    <a class="sponsor-card sponsor-kofi sponsor-card-sm" href="{{ site.funding.kofi }}" target="_blank" rel="noopener noreferrer">
      <span class="sponsor-icon" aria-hidden="true">🎁</span>
      <span>Ko-fi</span>
    </a>
    <a class="sponsor-card sponsor-paypal sponsor-card-sm" href="{{ site.funding.paypal }}" target="_blank" rel="noopener noreferrer">
      <span class="sponsor-icon" aria-hidden="true">💳</span>
      <span>PayPal</span>
    </a>
  </div>
</div>
