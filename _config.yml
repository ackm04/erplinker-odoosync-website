title: ERP Linker OdooSync
title_separator: "|"
description: Sync WooCommerce with Odoo 18/19 — products, orders, customers, and stock. Free OdooSync Lite WordPress plugin or Pro with real-time webhooks, HPOS, and GDPR support.
url: "https://ackm04.github.io"
baseurl: "/erplinker-odoosync-website"
lang: en

logo: /assets/img/logo-mark.svg
image: /assets/img/og-image.png

# Author meta is output in _includes/head-seo.html (jekyll-seo-tag mis-parses twitter handles from author.name).

social:
  name: ERP Linker OdooSync
  links:
    - https://github.com/ackm04/erplinker-odoosync-lite
    - https://erplinker.com/downloads/woocommerce-odoo-integration-odoosync/

keywords:
  - woocommerce odoo sync
  - wordpress odoo integration
  - odoo woocommerce plugin
  - odoo 18 woocommerce
  - odoo 19 woocommerce
  - woocommerce erp sync
  - odoo product sync
  - odoo order sync
  - woocommerce stock sync
  - hpos odoo integration

markdown: kramdown
kramdown:
  input: GFM

